name: Security checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "19 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust 1.97
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Install audit tools
        run: |
          cargo +1.97.0 install --locked cargo-audit --version 0.22.2
          cargo +1.97.0 install --locked cargo-deny --version 0.20.2
      - name: RustSec audit
        run: cargo +1.97.0 audit
      - name: License, source, and dependency policy
        run: cargo +1.97.0 deny check

  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust 1.97
        run: rustup toolchain install 1.97.0 --profile minimal --component clippy,rustfmt
      - name: Format
        run: cargo +1.97.0 fmt --all -- --check
      - name: Clippy
        run: cargo +1.97.0 clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        env:
          # macOS /var is a symlink; some Windows runner TEMP trees are
          # reparse points. EnvVault rejects linked ancestors.
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: cargo +1.97.0 test --workspace --all-features --locked
