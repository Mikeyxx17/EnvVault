name: Security checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "19 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.97.1

defaults:
  run:
    shell: bash

jobs:
  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      # JS checkout (v4 node20 and v7 node24) failed at job setup
      # with no step logs on all hosted OSes. Fetch with git instead.
      - name: Checkout
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -eux
          git init
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git config --global --add safe.directory '*'
          git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" \
            fetch --no-tags --prune --depth 1 origin "${GITHUB_SHA}" \
            || git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" \
              fetch --no-tags --prune --depth 1 origin "${GITHUB_REF}"
          git checkout --force FETCH_HEAD
          git log -1 --oneline
      - name: Install Rust 1.97.1
        run: |
          CARGO_BIN="${CARGO_HOME:-$HOME/.cargo}/bin"
          echo "$CARGO_BIN" >> "$GITHUB_PATH"
          export PATH="$CARGO_BIN:${USERPROFILE:-}/.cargo/bin:${PATH}"
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustc --version
          cargo --version
      - name: Install audit tools
        run: |
          cargo install --locked cargo-audit --version 0.22.2
          cargo install --locked cargo-deny --version 0.20.2
      - name: RustSec audit
        run: cargo audit
      - name: License, source, and dependency policy
        run: cargo deny check

  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -eux
          git init
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git config --global --add safe.directory '*'
          git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" \
            fetch --no-tags --prune --depth 1 origin "${GITHUB_SHA}" \
            || git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" \
              fetch --no-tags --prune --depth 1 origin "${GITHUB_REF}"
          git checkout --force FETCH_HEAD
          git log -1 --oneline
      - name: Install Rust 1.97.1
        run: |
          CARGO_BIN="${CARGO_HOME:-$HOME/.cargo}/bin"
          echo "$CARGO_BIN" >> "$GITHUB_PATH"
          export PATH="$CARGO_BIN:${USERPROFILE:-}/.cargo/bin:${PATH}"
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1
          rustc --version
          cargo --version
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        env:
          # macOS /var is a symlink; some Windows runner TEMP trees are
          # reparse points. EnvVault rejects linked ancestors.
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: cargo test --workspace --all-features --locked
