name: Scheduled fuzzing

on:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  libfuzzer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [vault, identity_audit, policy_profile, dotenv]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install nightly Rust
        run: rustup toolchain install nightly-2026-07-31 --profile minimal
      - name: Install cargo-fuzz
        run: cargo +nightly-2026-07-31 install --locked cargo-fuzz --version 0.13.2
      - name: Fuzz for five minutes
        run: cargo +nightly-2026-07-31 fuzz run ${{ matrix.target }} -- -max_total_time=300 -max_len=32768
      - name: Preserve crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
