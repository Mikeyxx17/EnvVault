name: Scheduled fuzzing

on:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:
    inputs:
      seconds-per-target:
        description: "Seconds to fuzz each target"
        required: false
        default: "1800"
      max-len:
        description: "Maximum input length passed to libFuzzer"
        required: false
        default: "32768"

permissions:
  contents: read

env:
  NIGHTLY: nightly-2026-07-31
  CARGO_FUZZ_VERSION: 0.13.2

jobs:
  libfuzzer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [vault, identity_audit, policy_profile, dotenv]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install nightly Rust with llvm-tools
        run: rustup toolchain install $NIGHTLY --profile minimal --component llvm-tools-preview

      - name: Install cargo-fuzz
        run: cargo +$NIGHTLY install --locked cargo-fuzz --version $CARGO_FUZZ_VERSION

      - name: Fuzz
        id: fuzz
        continue-on-error: true
        env:
          SECONDS_PER_TARGET: ${{ github.event.inputs.seconds-per-target || '1800' }}
          MAX_LEN: ${{ github.event.inputs.max-len || '32768' }}
        run: cargo +$NIGHTLY fuzz run ${{ matrix.target }} -- -max_total_time=$SECONDS_PER_TARGET -max_len=$MAX_LEN

      - name: Minimize corpus
        continue-on-error: true
        run: cargo +$NIGHTLY fuzz cmin ${{ matrix.target }} fuzz/corpus/${{ matrix.target }}

      - name: Coverage
        continue-on-error: true
        run: |
          cargo +$NIGHTLY fuzz coverage ${{ matrix.target }} fuzz/corpus/${{ matrix.target }}
          SYSROOT="$(rustc +$NIGHTLY --print sysroot)"
          TRIPLE="$(rustc +$NIGHTLY -vV | sed -n 's/^host: //p')"
          LLVM_DIR="$SYSROOT/lib/rustlib/$TRIPLE/bin"
          BIN="$(find "target/$TRIPLE/coverage" -type f -path "*/release/${{ matrix.target }}" | head -n1)"
          PROF="fuzz/coverage/${{ matrix.target }}/coverage.profdata"
          mkdir -p "fuzz/coverage/${{ matrix.target }}/html"
          "$LLVM_DIR/llvm-cov" report "$BIN" -instr-profile="$PROF" \
            -ignore-filename-regex="registry|toolchains|rustlib" \
            > "fuzz/coverage/${{ matrix.target }}/report.txt"
          "$LLVM_DIR/llvm-cov" show "$BIN" -instr-profile="$PROF" \
            -ignore-filename-regex="registry|toolchains|rustlib" \
            -format=html -output-dir="fuzz/coverage/${{ matrix.target }}/html"

      - name: Upload corpus
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: corpus-${{ matrix.target }}
          path: fuzz/corpus/${{ matrix.target }}
          if-no-files-found: ignore

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.target }}
          path: fuzz/coverage/${{ matrix.target }}
          if-no-files-found: ignore

      - name: Preserve crash artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

      - name: Fail on discovered crash
        if: steps.fuzz.outcome == 'failure'
        run: exit 1
