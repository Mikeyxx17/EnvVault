[package]
name = "envvault"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Local-first secret manager and authorization broker for developers and AI coding agents"
publish = false

[features]
default = []
fuzzing = []

[dependencies]
argon2 = { version = "0.5.3", default-features = false, features = ["alloc"] }
atomic-write-file = "0.3.0"
base64 = { version = "0.23.0", default-features = false, features = ["std"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
clap = { version = "4.6.6", features = ["derive"] }
dialoguer = { version = "0.12.0", default-features = false, features = ["password"] }
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.11.0", default-features = false }
subtle = "2.6"
zeroize = "1.9.0"

[target.'cfg(windows)'.dependencies]
keyring-core = "1.0.0"
windows-permissions = "0.2.4"
windows-native-keyring-store = "1.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
keyring-core = "1.0.0"
zbus-secret-service-keyring-store = { version = "1.0.0", features = ["rt-async-io-crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.1", default-features = false, features = ["keychain"] }
keyring-core = "1.0.0"

[dev-dependencies]
proptest = "1.7"
tempfile = "3"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
